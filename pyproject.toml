[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icplugin-builder"
version = "0.1.0"
description = "Locally-run tool that turns natural-language descriptions into Rapid7 InsightConnect plugins via the insight-plugin CLI and the Kiro CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rapid7 InsightConnect" }]
keywords = ["insightconnect", "rapid7", "plugin", "builder", "kiro"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "ruamel.yaml>=0.18",
    "jsonschema>=4.21",
    "cryptography>=42.0",
    # Vendor API documentation arrives as a PDF often enough to matter, and a PDF
    # written verbatim is bytes the delegated agent cannot read (Req 28.11).
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "black>=24.0",
    "flake8>=7.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/rapid7/insightconnect-plugin-builder"
Repository = "https://github.com/rapid7/insightconnect-plugin-builder"

[project.scripts]
icplugin-builder = "icplugin_builder.api.app:main"

[tool.setuptools.packages.find]
include = ["icplugin_builder*"]

[tool.setuptools.package-data]
# The vendored prospector profile is read at runtime, so it has to ship in the
# wheel rather than only existing in a source checkout.
"icplugin_builder.integrations" = ["data/*.yaml"]
# The built web interface, staged here by `make ui` from the Vite output. Without
# it an installed wheel serves the API and returns a bare 404 at "/", which reads
# as a broken install rather than a missing build step. Generated, not authored:
# `make clean` removes it and the source of truth is `frontend/`.
"icplugin_builder" = ["ui/**/*", "rulebook/**/*.md"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    # Opts out of tests/conftest.py's blanket block on the package-index lookup.
    # Such a test still contacts no network -- it injects a stub fetcher -- it just
    # needs the real resolution logic left in place to exercise.
    "consults_package_index: exercises the PyPI SDK-version lookup with a stub fetcher",
]
